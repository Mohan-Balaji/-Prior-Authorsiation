# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
name: Build and deploy Python app to Azure Web App - Prior-Authorization-12
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🛠️ Local Build Section (Optional)
      # Installs from backend/requirements.txt (the one actually used at runtime)
      # to catch dependency issues early. Safe to remove if it's not adding value.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r backend/requirements.txt

      # Only backend/ is deployed, and it's flattened so app.py, routes/,
      # models/, requirements.txt, gunicorn.conf.py, etc. all land at the
      # deploy root. Everything outside backend/ (frontend/, KB/, database/,
      # patient_db/, model/, docs, root requirements.txt) is excluded.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/*
            backend/**
          include-hidden-files: false

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_457A637CAA3F40E48BE7743274A59DAE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8F6F9A81AFCA429B880EEB9029D66B8E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9C0ADD677C104C0E929E924BBF94DBA8 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'Prior-Authorization-12'
          slot-name: 'Production'
          startup-command: 'pip install -r requirements.txt && gunicorn app:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000'
