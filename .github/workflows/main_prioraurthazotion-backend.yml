name: Build and deploy Python app to Azure Web App - priorAurthazotion-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify application
        working-directory: backend
        run: |
          python -c "import uvicorn; print('Uvicorn installed successfully')"

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r backend/* deploy/
          rm -rf deploy/antenv
          rm -rf deploy/__pycache__

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy/


  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_88FF186725514FCEB4C9351D293F0A20 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5E42644D523045258137F37300A139F2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_07AED3FE07C94B43B02F4E358C5F57EF }}

      - name: Enable Azure build during deployment
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --resource-group "Prior-Authorization" \
              --name "priorAurthazotion-backend" \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'priorAurthazotion-backend'
          slot-name: 'Production'
          package: ./deploy
