name: Build and deploy Python app to Azure Web App - priorAurthazotion-backend
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Flatten backend to root
        run: |
          cp backend/requirements.txt ./requirements.txt
          cp backend/app.py ./app.py
          cp backend/db.py ./db.py
          cp backend/auth.py ./auth.py
          cp backend/validators.py ./validators.py
          cp backend/urgency.py ./urgency.py
          cp backend/rate_limiter.py ./rate_limiter.py
          cp backend/decision_engine.py ./decision_engine.py
          cp backend/eval_logger.py ./eval_logger.py
          cp backend/evaluation.py ./evaluation.py
          cp backend/ml_predictor.py ./ml_predictor.py
          cp backend/pdf_ocr.py ./pdf_ocr.py
          cp -r backend/routes ./routes
          cp -r backend/models ./models

      - name: Remove oryx build cache
        run: rm -f oryx-manifest.toml

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: .
          clean: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_88FF186725514FCEB4C9351D293F0A20 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5E42644D523045258137F37300A139F2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_07AED3FE07C94B43B02F4E358C5F57EF }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'priorAurthazotion-backend'
          slot-name: 'Production'
